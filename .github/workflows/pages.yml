name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: mkdir _site && cp -r index.html css js descargas .nojekyll _site/
      - name: Version asset URLs (avoid stale CSS/JS after a deploy)
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(href=\"css/styles\.css)\"#\1?v=$V\"#; s#(src=\"js/app\.js)\"#\1?v=$V\"#" _site/index.html
          find _site/js -name '*.js' -exec sed -i -E "s#(from \"\./[^\"]+\.js)\"#\1?v=$V\"#g" {} +
          grep -q "styles.css?v=$V" _site/index.html
          grep -q "app.js?v=$V" _site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
